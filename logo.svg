<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle with border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#1b8a8f" stroke-width="2.5"/>

  <!-- Text around circle (circular text approximation) -->
  <defs>
    <path id="circle-path" d="M 30, 100 A 70, 70 0 0,1 170, 100 A 70, 70 0 0,1 30, 100" fill="none"/>
    <path id="circle-path-bottom" d="M 170, 100 A 70, 70 0 0,1 30, 100" fill="none"/>
  </defs>

  <!-- Three main circles -->
  <!-- Left circle -->
  <circle cx="65" cy="75" r="12" fill="#1b8a8f"/>
  <!-- Right circle -->
  <circle cx="135" cy="75" r="12" fill="#1b8a8f"/>
  <!-- Center top circle -->
  <circle cx="100" cy="60" r="14" fill="#1b8a8f"/>

  <!-- Main triangle/person shape -->
  <path d="M 100 50 L 130 100 L 125 145 Q 100 155 75 145 L 70 100 Z" fill="#1b8a8f"/>

  <!-- Left leaf -->
  <ellipse cx="70" cy="145" rx="8" ry="18" fill="#1b8a8f" transform="rotate(-35 70 145)"/>

  <!-- Right leaf -->
  <ellipse cx="130" cy="145" rx="8" ry="18" fill="#1b8a8f" transform="rotate(35 130 145)"/>

  <!-- Small decorative leaves on top -->
  <ellipse cx="88" cy="55" rx="5" ry="12" fill="#1b8a8f" transform="rotate(-30 88 55)"/>
  <ellipse cx="112" cy="55" rx="5" ry="12" fill="#1b8a8f" transform="rotate(30 112 55)"/>

  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#1b8a8f" stroke-width="1.5"/>

  <!-- Text labels positioned around circle -->
  <text x="100" y="18" font-family="Arial, sans-serif" font-size="8" font-weight="600" text-anchor="middle" fill="#1b8a8f" letter-spacing="1">
    HHRDO
  </text>

  <text x="182" y="105" font-family="Arial, sans-serif" font-size="7" text-anchor="start" fill="#1b8a8f" letter-spacing="0.5">
    Organization
  </text>

  <text x="18" y="105" font-family="Arial, sans-serif" font-size="7" text-anchor="end" fill="#1b8a8f" letter-spacing="0.5">
    Relief &amp;
  </text>

  <text x="100" y="185" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#1b8a8f" letter-spacing="0.5">
    2023
  </text>
</svg>